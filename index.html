/* 広告 */
#layer{position:absolute;left:0;right:0;z-index:20;pointer-events:none}

.ad.full{border-radius:0;padding:24px 18px}

.ad .h{text-wrap:balance}

.ad .skipP.ext{color:#ffcf33}
.ad.sound .spk{position:absolute;right:10px;bottom:10px;width:40px;height:40px}
.ad.sound .spk i{position:absolute;inset:0;border:2.5px solid #fff;border-radius:50%;opacity:0;animation:wave 1s ease-out infinite}
.ad.sound .spk i:nth-child(2){animation-delay:.33s}.ad.sound .spk i:nth-child(3){animation-delay:.66s}
@keyframes wave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.ad.sound .spk svg{position:absolute;inset:8px;width:24px;height:24px}
.ad.sound{animation:adIn .16s ease-out,sndJit .18s linear infinite .2s}
@keyframes sndJit{50%{transform:translate(1px,-1px)}}
.ad .mute svg{width:18px;height:18px;flex:none}
.ad .mute{margin-top:8px;font:700 14px/1 var(--sys);padding:10px 18px;border-radius:6px;background:#fff;color:#222;display:flex;align-items:center;gap:6px}
.ad.sheet{border-radius:16px 16px 0 0;justify-content:flex-start;padding-top:22px;animation:none;transition:none}

.ad.reco{padding:6px 8px;justify-content:flex-start}

.ad.confirm .cls{font:500 11px/1 var(--sys);color:#b9bcc2;padding:6px 10px}
.ad.giant .h{font-size:28px}
.ad .gl{position:absolute;inset:0;pointer-events:none;border:3px dashed rgba(255,255,255,.5)}
.ad.honest{background:#eceeef!important;color:#333;font-family:var(--sys)}
.ad.honest .hb{margin-top:10px;min-height:48px;padding:0 30px;border-radius:8px;background:#333;color:#fff;font:700 16px/1 var(--sys)}
/* 広告の色（安い広告の配色。わざと） */
.b1{background:linear-gradient(160deg,#fff04a,#ff9f1a);color:#d3140e}
.b1 .h{text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}
.b2{background:radial-gradient(circle at 50% 30%,#7a0b0b,#1a0202);color:#ffd84a}

.b3{background:linear-gradient(170deg,#ff7ab6,#ff2d7a);color:#fff}

.b4{background:linear-gradient(170deg,#21d4fd,#1b5cff);color:#fff94a}

.b7{background:#d9d4cc;color:#333}
.ad.lk-sys,.ad.lk-chat{outline:0!important}
/* 偽のシステム警告・偽のメッセージ通知（広告の見た目をばらけさせる） */
.ad.lk-sys{background:#f4f4f6!important;color:#111;font-family:var(--sys);border-radius:14px;padding:14px 14px 12px;justify-content:flex-start;gap:6px}

/* 閉じるボタン: 本物は小さく灰色。偽物は大きく広告の絵の中 */
.cx{position:absolute;z-index:3;pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.cx.dot{width:13px;height:13px;border-radius:50%;background:rgba(120,124,130,.92);color:#fff;font:700 10px/1 var(--sys)}
.cx.dot::after{content:"";position:absolute;inset:-9px}
.cx.faint{opacity:.38}
.cx.big{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;font:900 24px/1 var(--sys);border:3px solid #111;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.cx.big.dark{background:#111;color:#fff;border-color:#fff}
.cx.skip{position:absolute;right:0;bottom:22px;min-height:44px;padding:0 16px;background:rgba(0,0,0,.8);color:#fff;font:700 15px/1 var(--sys);border:1px solid rgba(255,255,255,.6);border-right:0;gap:6px;white-space:nowrap}
.cx.skip svg{width:12px;height:12px}
#phone.lens .cx.dot{transform:scale(3.1);background:#1f8a3a;opacity:1;box-shadow:0 0 0 1px #fff}
#phone.lens .cx.skip,#phone.lens .cx.cls{outline:2px solid #2fd35a;color:#1f8a3a}
#phone.lens .cx.skip{color:#fff}
#phone.lens .cx.big::before{content:"偽";position:absolute;inset:-3px;border-radius:50%;background:rgba(214,20,28,.9);color:#fff;font:900 17px/38px var(--sys);text-align:center}
#phone.lens .ad.confirm .watch::after{content:"偽";margin-left:8px;background:#fff;color:#d6141c;padding:1px 4px;border-radius:3px;font-size:13px}
#phone.lens .ad.sound .mute::after{content:"偽";margin-left:4px;background:#d6141c;color:#fff;padding:1px 4px;border-radius:3px;font-size:12px}
#lensRing{position:absolute;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 0 4px #2fd35a,inset 0 0 40px rgba(47,211,90,.35);opacity:0;transition:opacity .2s}

/* 下の操作列 */
#dock{flex:none;height:calc(62px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));padding:0 12px calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px));background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;position:relative;z-index:30}

/* 場面の入り */

/* 開いたページ */

#doneOv.ng{border-top-color:#d6452b}

#deadOv{position:absolute;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#888;font:700 15px/1 var(--sys)}
#deadOv .db{width:64px;height:30px;border:3px solid #e2261c;border-radius:6px;position:relative;animation:blink 1s steps(2) infinite}
#deadOv .db::before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:5px;background:#e2261c}
#deadOv .db::after{content:"";position:absolute;right:-8px;top:8px;width:4px;height:8px;background:#e2261c}
@keyframes blink{50%{opacity:.2}}

/* 結果: ご利用明細 */
#vEnd .wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(58px + env(safe-area-inset-top)) 14px calc(8px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}

#bill .st{display:flex;justify-content:space-between;font-size:13px;color:#333}

#bill .goals i{font-style:normal;font-size:11px;padding:2px 4px;border:1.5px solid #1f8a3a;color:#1f8a3a}
#bill .goals i.ng{border-color:#bbb;color:#bbb;text-decoration:line-through}
#bill .rank{display:flex;align-items:center;gap:12px;margin-top:6px}
#stamp{flex:none;width:92px;height:92px;border:3px solid #c4140c;border-radius:50%;color:#c4140c;display:flex;align-items:center;justify-content:center;text-align:center;font:700 15px/1.2 var(--mono);transform:rotate(-14deg);padding:8px;background:rgba(196,20,12,.04);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px #c4140c}

@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}}

.endBtns{flex:none;display:flex;flex-direction:column;gap:6px;width:min(100%,400px)}
.endBtns .row2{display:flex;gap:6px}
.endBtns button{flex:1;min-height:44px;border-radius:6px;font:700 14px/1 var(--sys);background:rgba(20,16,12,.55);color:#f4ebdf;border:1px solid rgba(244,235,223,.35)}
#bAgain{min-height:52px;background:#ffd23a;color:#2a1a08;border:0;font-family:var(--pop);font-weight:400;font-size:18px;box-shadow:0 4px 0 #b8860b}
#card{display:none}

.ovl{position:fixed;inset:0;z-index:70;background:#1d1814;display:flex;flex-direction:column;padding:calc(58px + env(safe-area-inset-top)) 16px calc(14px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));color:#f4ebdf}
.ovl .in{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}

@media (min-height:800px){
  #bill{padding:20px 20px 22px;gap:9px;margin-top:2vh}

}

  #howBody{font-size:14px;gap:9px}
}

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
